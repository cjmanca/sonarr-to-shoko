[project]
name = "shoko-sonarr-linker"
version = "0.1.0"
description = "Link unrecognized Shoko files to AniDB episodes using Sonarr metadata and Anime-Lists mappings (read-only against Sonarr; Shoko API writes are gated)."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "C.J. Manca" }]
dependencies = [
    "httpx>=0.28.1,<0.29",
    "PyYAML>=6.0.2,<7",
    "defusedxml>=0.7.1,<0.8",
]

[project.scripts]
shoko-sonarr-linker = "shoko_linker.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.8,<0.9",
    "mypy>=1.13,<1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shoko_linker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "S", "RET", "PT",
    "ARG", "PTH", "PL", "RUF",
]
ignore = [
    "PLR0913",  # too many arguments: small factories are clearer than dicts
    "S101",      # assert used in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
warn_unreachable = true
files = ["src", "tests"]
