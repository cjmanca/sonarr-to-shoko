# GHCR per-commit publishing (M8, PROJECT.md §6).
#
# Action pins (M8 security review F9) — every `uses:` ref below is pinned to a
# full commit SHA with the tag noted in a trailing comment. SHAs fetched 2026-10-09
# from the GitHub public refs API (git/matching-refs/tags/v<MAJOR>.), newest
# patch release of the major version in use:
#   actions/checkout           v4.4.0    11d5960a326750d5838078e36cf38b85af677262
#   astral-sh/setup-uv         v4.2.0    38f3f104447c67c051c4a08e39b64a148898af3a
#   docker/login-action        v3.7.0    c94ce9fb468520275223c153574b00df6fe4bcc9
#   docker/setup-buildx-action v3.12.0   8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
#   docker/build-push-action   v6.19.2   10e90e3645eae34f1e60eeb005ba3a3d33f178e8
# Artifact pins fetched 2026-10-10 from the same refs API (F3 historical-validator
# artifact handoff; the publish legs validate pre-M8 commits with the
# current-branch validator, so plan must publish it as an artifact):
#   actions/upload-artifact    v4.4.0    50769540e7f4bd5e21e526ee35c689e35e0d6874
#   actions/download-artifact  v4.1.7    65a9edc5881444af0b9093a5e628f2fe47ea3b2e
#
# Local tooling note (M8 F2/F3 review): `actionlint` and `zizmor` are NOT
# installed on the development host, so workflow lint/security scanning is
# substituted by the structural PyYAML assertions in tests/test_workflows.py
# (permissions, gates, PR isolation, pins, env-indirection hygiene, tag/regex
# shapes) plus manual review. The first authorized live workflow run remains
# the external validation; publication stays EXTERNAL/UNVERIFIED (see
# docs/deployment.md).
#
# Design decisions
# ----------------
# * Shell-injection hygiene (F1): NO `${{ }}` expression is expanded inside a
#   `run:` script body. Every github.*/inputs.* value reaches the shell only via
#   job/step-level `env:` indirection ("$ENV_VAR"), and dispatch SHA inputs are
#   validated as 40-char lowercase hex before any use, with dispatch ranges
#   gated against the selected branch head and from_sha gated against to_sha
#   (see the plan step). Interpolation remains in
#   `uses:`/`with:`/`if:`/`tags:` — those contexts are evaluated by GitHub, not
#   a shell (build-push `tags:` values become CLI args, never shell text).
# * GHCR image reference (F2): the GitHub context property is
#   `github.repository_owner` (snake_case — the camelCase property name does
#   not exist, resolves to an empty string, and produced
#   `ghcr.io//shoko-sonarr-linker:latest` = "invalid reference format"), the
#   owner is never hardcoded, and the full reference is lowercased (GHCR
#   requires lowercase; owners can contain capitals). The plan job computes
#   `IMAGE_REF` once from env-indirected owner + `tr A-Z a-z` + explicit
#   (owner non-empty, GHCR namespace-segment regex, full-reference regex) and
#   publishes it as a job output; publish/promote build `tags:` from
#   `${{ needs.plan.outputs.image }}` (GitHub-evaluated `with:` input, never
#   shell), and each push leg re-validates the assembled tag against
#   `^ghcr\.io/[a-z0-9._-]+/shoko-sonarr-linker:(sha-[0-9a-f]{40}|latest)$`
#   BEFORE docker/build-push-action can receive an invalid reference.
# * Registry is the publication state (F3): git `refs/tags` are independent of
#   GHCR container tags (publishing `sha-<fullsha>` creates no git tag), so the
#   plan job discovers already-published images with scripts/ghcr_tags.py
#   (OCI token flow, pull scope, GITHUB_TOKEN via env indirection, Link-header
#   pagination) instead of `git ls-remote --tags`. Outcome classes are
#   explicit (ok / package_missing / auth_failure / permission_failure /
#   network_failure / unavailable); on ANY failure class the plan ABORTS the
#   run — it never publishes against unknown registry state. `package_missing`
#   (401/404 NAME_UNKNOWN after a successful token exchange) is the documented
#   first-publish state and is treated as "nothing published yet".
# * Provenance verification (F3, F12, best-effort bounded): a registry `sha-<fullsha>`
#   tag counts as published only when the manifest/config chain carries
#   `org.opencontainers.image.revision` == the full SHA. Up to 10 tags are
#   verified per run (VERIFY_CAP in scripts/ghcr_tags.py); the verification
#   window rotates across runs using GITHUB_RUN_NUMBER while the matrix cap stays 10.
#   scripts/ghcr_plan.py is the shared, tested tag-normalization, membership, and
#   outcome planner.
#   Tag states and their ONLY allowed actions:
#     published           -> skip (already published; never re-pushed)
#     not_published       -> tag is ABSENT -> safe to publish/backfill
#     unknown_provenance  -> registry/tag state or provenance could not be
#                            verified -> NEVER published/overwritten; the plan
#                            ABORTS and lists the SHA for reconciliation.
#   A `sha-` tag NAME derived from a commit is NOT proof that the existing
#   image is immutable/correct, so an unverified existing tag is never
#   silently replaced. Registry discovery + provenance need read-only pull
#   scope: the plan job carries `packages: read` (never `write`).
# * Historical validation (F3): each publish leg checks out its own SHA, so
#   commits that predate `scripts/ci_checks.sh` (M8) cannot run the shared
#   check list from their own tree. The plan job uploads `scripts/validate_
#   historical.py` from the CURRENT (trusted) checkout as a pinned artifact;
#   the leg downloads it and runs it against the historical working tree when
#   (and only when) `scripts/ci_checks.sh` is absent at that SHA. Historical
#   commits are never credited with the current commit's checks.
# * Immutable SHA tags: every introduced commit (including ones inside a
#   multi-commit push) gets `sha-<fullsha>`. The plan NEVER pushes a tag name
#   that already exists in the registry (verified-published SKIPPED,
#   unverifiable ABORTED with a reconciliation list), so published sha-
#   tags are never overwritten — tag-name derivation is not the safety
#   argument, the registry-state gate is.
# * Per-SHA registry race: each publish leg is serialized by its exact SHA and
#   re-verifies the tag after acquiring that lock. A verified existing image is
#   skipped, an absent tag may publish, and unknown state fails closed. GHCR has
#   no atomic conditional tag write here; this lock covers this workflow's legs,
#   not out-of-band writers that race after verification.
# * Fork/PR isolation: this workflow's publish/plan/promote jobs are
#   gated to push / schedule / workflow_dispatch events; `pull_request`
#   runs ONLY the read-only test job (GitHub gives PR runs a read-only token,
#   and no job requests `packages: write` on PR events). Nothing is ever
#   published from untrusted PR code.
# * Per-SHA verification is REAL: each matrix leg checks out its own SHA
#   and re-runs the checks available FOR THAT COMMIT (scripts/ci_checks.sh
#   from M8 onward, the uploaded historical validator before that) —
#   no cross-commit cached "pass" is trusted.
# * `latest` is promoted only after test and plan pass for default-branch pushes,
#   the main-only schedule, or safe workflow_dispatch backfills on main, under
#   its dedicated serialized group. Manual backfills dispatched against any
#   other branch can publish sha- tags but cannot promote latest.
#   The per-SHA matrix does not mask failures: fail-fast is false so siblings
#   finish, but any failed leg blocks promotion. An empty matrix may be skipped;
#   promotion then still verifies this exact SHA's immutable registry tag and
#   provenance. Immediately before pushing latest it re-reads `git ls-remote`
#   and aborts if this run's SHA is no longer the current head of main. GHCR has
#   no atomic conditional tag update; serialization plus the immediate head
#   check prevents an older completed promotion from replacing a newer one.
# * Least privilege: top-level `contents: read`; only publish/promote-latest
#   add `packages: write`; plan adds `packages: read` for pull-only registry
#   discovery. Same-run artifact upload/download needs no Actions API permission.
#   No repository secrets are referenced (`secrets.GITHUB_TOKEN` only);
#   Sonarr/Shoko keys never exist in CI.
# * Event gap (documented; GitHub does NOT fire `push` workflows for commits
#   created by workflows using GITHUB_TOKEN, e.g. merge-queue/auto-commits).
#   This project never self-commits, so the gap does not arise from our own
#   automation; if a GITHUB_TOKEN-authored commit ever lands
#   on main, the weekly `schedule` backfill and manual
#   `gh workflow run publish.yml --ref <branch> -f backfill=true`
#   recover the untagged SHAs on the selected in-repository branch. Optional
#   `from_sha`/`to_sha` bound the range; `to_sha` must be an ancestor of that
#   branch's fetched head and `from_sha` an ancestor of `to_sha`. Because the
#   registry (not git tags) is the publication state, recovery is idempotent: a
#   repeated backfill against an unchanged registry schedules ZERO already-
#   published images.
#   Enumeration/backfill semantics are covered by tests/test_publish_enumeration.py.
# * Dispatch trust boundary (F3): workflow_dispatch requires repository write
#   access — anyone who can dispatch can already run code in this repo. The
#   gate is defense-in-depth, not a secret boundary: `PUSH_REF` must be a
#   `refs/heads/*` branch, fetched from origin; `to_sha` must be a 40-hex SHA
#   AND an ancestor of that selected branch head, and a supplied `from_sha`
#   must be an ancestor of `to_sha`, so dispatch cannot publish arbitrary
#   unrelated ranges.
# * Cap: plan enforces max 10 SHAs per run (must match DEFAULT_MAX_SHAS in
#   scripts/enumerate_introduced.py); overflow is reported in the job summary
#   as a warning (failing-soft note) and recovered by backfill — never dropped.
#   A non-positive `max_shas` dispatch input fails closed (plan aborts).
# * Push retention: there is deliberately no workflow-level concurrency group,
#   because Actions can replace a pending run when another push arrives. The
#   weekly schedule scans main only; a manual `workflow_dispatch --ref <branch>`
#   fetches that branch tip to recover capped/unmerged topic-branch SHAs. Per-SHA
#   job locks deduplicate publication and recheck registry provenance without
#   dropping push events.
# * Failed legs: `fail-fast: false` lets sibling SHA legs finish, but any failed
#   leg fails the publish job and blocks latest promotion. A later backfill
#   rechecks registry provenance for the failed SHA (skip if already published,
#   publish only if proven absent); the per-leg report identifies the SHA.

name: Publish (GHCR)

on:
  push:
    branches: ["**"] # branch pushes only; tag pushes are intentionally not triggers
  pull_request:
  workflow_dispatch:
    inputs:
      from_sha:
        description: Backfill range start SHA (exclusive; full lowercase SHA and ancestor of to_sha).
        required: false
        type: string
      to_sha:
        description: "Backfill range end SHA (full lowercase SHA; default: fetched head of the selected refs/heads/* branch; must be its ancestor)."
        required: false
        type: string
      backfill:
        description: Recover untagged SHAs on the selected repository branch (registry-gap scan); each run remains capped.
        required: false
        type: boolean
        default: true
      max_shas:
        description: Cap SHAs published in this run (matrix cap; default 10, hard max 10, must be positive).
        required: false
        type: string
        default: "10"
  schedule:
    - cron: "13 3 * * 1" # weekly bounded backfill (Monday ~03:13 UTC)

permissions:
  contents: read

jobs:
  test:
    # Runs for every event (push / pull_request / workflow_dispatch / schedule)
    # against the ACTUAL candidate SHA. For pull_request events GitHub checks out
    # the PR merge ref by default (refs/pull/N/merge) — the merged candidate that
    # the push would produce; documented, deliberate GitHub default.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
      - name: Install (locked dev group)
        run: uv sync --frozen
      - name: Checks (shared list — same commands the per-SHA publish legs run)
        run: bash scripts/ci_checks.sh

  plan:
    needs: test
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.backfill) }}
    runs-on: ubuntu-latest
    # F1: all github.*/inputs.* values reach the shell ONLY through these env
    # indirections; the run bodies below contain zero `${{ }}` expressions.
    # F3: registry discovery is pull-only, so this job carries packages:read;
    # publish/promote-latest own the only packages:write grants.
    permissions:
      contents: read
      packages: read
    env:
      EVENT_NAME: ${{ github.event_name }}
      PUSH_BEFORE: ${{ github.event.before }}
      PUSH_SHA: ${{ github.sha }}
      PUSH_REF: ${{ github.ref }}
      MAX_SHAS_INPUT: ${{ inputs.max_shas }}
      FROM_SHA_INPUT: ${{ inputs.from_sha }}
      TO_SHA_INPUT: ${{ inputs.to_sha }}
      REPO_OWNER: ${{ github.repository_owner }}
      GHCR_PACKAGE: shoko-sonarr-linker
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      shas: ${{ steps.plan.outputs.shas }}
      image: ${{ steps.image_name.outputs.image }}
      owner: ${{ steps.image_name.outputs.owner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/main' || github.ref }}
          fetch-depth: 0 # full history + merge-base needed for enumeration
      - name: Compute & validate lowercase GHCR image reference
        # F2: github.repository_owner (snake_case) via env indirection, lowercased
        # with tr, validated loudly BEFORE any docker/build-push-action runs.
        id: image_name
        run: |
          set -euo pipefail
          die() { echo "::error::$1" >&2; exit 1; }
          [ -n "${REPO_OWNER}" ] || die "github.repository_owner is empty: refusing to build an invalid ghcr.io image reference"
          OWNER_LOWER=$(printf '%s' "${REPO_OWNER}" | tr 'A-Z' 'a-z')
          printf '%s' "${OWNER_LOWER}" | LC_ALL=C grep -Eq '^[a-z0-9]+(-[a-z0-9]+)*$' || die "owner '${REPO_OWNER}' lowercases to '${OWNER_LOWER}', which is not a valid GHCR namespace segment"
          printf '%s' "${GHCR_PACKAGE}" | LC_ALL=C grep -Eq '^[a-z0-9]+(-[a-z0-9]+)*$' || die "package '${GHCR_PACKAGE}' is not a valid GHCR namespace segment"
          IMAGE_REF="ghcr.io/${OWNER_LOWER}/${GHCR_PACKAGE}"
          printf '%s' "${IMAGE_REF}" | LC_ALL=C grep -Eq '^ghcr\.io/[a-z0-9._-]+/shoko-sonarr-linker$' || die "computed image reference '${IMAGE_REF}' is not a valid GHCR image name"
          echo "image=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "owner=${OWNER_LOWER}" >> "$GITHUB_OUTPUT"
      - name: Discover published GHCR image tags (registry is the publication state)
        # F3: replaces `git ls-remote --tags` — git refs say nothing about
        # container tags. Any failure class aborts the run (no publishing
        # against unknown state); package_missing = fresh package, nothing yet.
        env:
          GHCR_OWNER: ${{ steps.image_name.outputs.owner }}
        run: |
          set -euo pipefail
          die() { echo "::error::$1" >&2; exit 1; }
          python3 scripts/ghcr_tags.py list --owner "${GHCR_OWNER}" > registry.json
          STATUS=$(jq -r '.status' registry.json)
          DETAIL=$(jq -r '.detail' registry.json)
          case "${STATUS}" in
            ok|package_missing) python3 scripts/ghcr_plan.py tags --registry registry.json > known_tags.txt ;;
            *) die "GHCR registry discovery failed (${STATUS}: ${DETAIL}); refusing to publish against unknown registry state" ;;
          esac
          echo "- registry: ${STATUS} (${DETAIL})" >> "$GITHUB_STEP_SUMMARY"
      - name: Compute SHA matrix
        id: plan
        env:
          GHCR_OWNER: ${{ steps.image_name.outputs.owner }}
        run: |
          set -euo pipefail
          ZERO_SHA="0000000000000000000000000000000000000000"
          die() { echo "::error::$1" >&2; exit 1; }
          is_full_sha() {
            [ "${#1}" -eq 40 ] && printf '%s' "$1" | LC_ALL=C grep -Eq '^[0-9a-f]{40}$'
          }
          # Python validates/clamps decimal input without shell integer overflow.
          MAX=$(python3 scripts/ghcr_plan.py max-shas --value "${MAX_SHAS_INPUT}")
          FIRST_BUILDABLE=aa6b85ea71192d9c94c7f3c8a58d715c6c37db42 # recorded first-buildable boundary (M1)
          if [ "$EVENT_NAME" = "push" ] && [ "$PUSH_SHA" = "$ZERO_SHA" ]; then
            # F6: branch-deletion push (before=<tip>, after=0000...0) publishes
            # nothing; exit 0 with an empty matrix so the plan is explicit.
            echo "shas=[]" >> "$GITHUB_OUTPUT"
            {
              echo "## Publish plan"
              echo "- branch-deleted: all-zero after SHA (branch deletion); nothing to publish"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          run_missing() {
            local extra_unverified="${1:-}"
            local args=(missing --repo . --upto "$TO" --known-tags-file known_tags.txt --max-shas "$MAX")
            if [ -n "$FROM" ]; then args+=(--since "$FROM"); fi
            if [ -n "$extra_unverified" ]; then args+=(--unverified-file "$extra_unverified"); fi
            python3 scripts/enumerate_introduced.py "${args[@]}" > plan.json
          }
          if [ "$EVENT_NAME" = "push" ]; then
            python3 scripts/enumerate_introduced.py introduced \
              --repo . --before "$PUSH_BEFORE" --after "$PUSH_SHA" \
              --ref "$PUSH_REF" --default-branch main \
              --first-buildable "$FIRST_BUILDABLE" --max-shas "$MAX" > plan.json
          else
            TO="$TO_SHA_INPUT"
            FROM="$FROM_SHA_INPUT"
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              # F3 dispatch trust boundary: only fetch the selected in-repository
              # branch, and constrain the backfill to its fetched tip.
              case "$PUSH_REF" in
                refs/heads/*) ;;
                *) die "workflow_dispatch ref must be a branch (refs/heads/*), got '$PUSH_REF'" ;;
              esac
              git fetch --no-tags origin "$PUSH_REF"
              BRANCH_HEAD=$(git rev-parse FETCH_HEAD)
              if [ -z "$BRANCH_HEAD" ]; then die "could not resolve selected branch head for '$PUSH_REF'"; fi
              if [ -z "$TO" ]; then TO="$BRANCH_HEAD"; fi
            else
              if [ -z "$TO" ]; then TO="$PUSH_SHA"; fi
            fi
            if [ -n "$TO" ] && ! is_full_sha "$TO"; then die "invalid to_sha input: not-40-hex (must be a 40-char lowercase hex commit SHA)"; fi
            if [ -n "$FROM" ] && ! is_full_sha "$FROM"; then die "invalid from_sha input: not-40-hex (must be a 40-char lowercase hex commit SHA)"; fi
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              if ! git merge-base --is-ancestor "$TO" "$BRANCH_HEAD"; then
                die "invalid to_sha input: not-ancestor-of-selected-branch-head ($TO is not an ancestor of selected branch '$PUSH_REF' at ${BRANCH_HEAD}); refusing to publish an out-of-branch range"
              fi
            fi
            if [ -n "$FROM" ] && ! git merge-base --is-ancestor "$FROM" "$TO"; then
              die "invalid from_sha input: not-ancestor-of-to-sha ($FROM is not an ancestor of to_sha $TO); refusing a reversed or unrelated range"
            fi
            run_missing
          fi

          # One shared planner owns tag parsing, membership, the bounded verify
          # set, and every provenance outcome for both push and backfill plans.
          python3 scripts/ghcr_plan.py prepare --plan plan.json \
            --known-tags-file known_tags.txt --max-verify 10 \
            --rotation "$GITHUB_RUN_NUMBER" > ghcr_prepared.json
          VERIFY_SHAS=$(jq -r '.verify_shas | join(",")' ghcr_prepared.json)
          if [ -n "$VERIFY_SHAS" ]; then
            python3 scripts/ghcr_tags.py verify --owner "${GHCR_OWNER}" \
              --shas "${VERIFY_SHAS}" > provenance.json
            VSTATUS=$(jq -r '.status' provenance.json)
            [ "$VSTATUS" = "ok" ] || die "provenance verification failed (${VSTATUS}: $(jq -r '.detail' provenance.json)); refusing to publish against unknown registry state"
          else
            printf '{"status":"ok","results":{},"detail":"no existing candidate tags to verify"}\n' > provenance.json
          fi
          python3 scripts/ghcr_plan.py finalize --plan plan.json \
            --known-tags-file known_tags.txt --prepared ghcr_prepared.json \
            --provenance provenance.json --max-verify 10 \
            --rotation "$GITHUB_RUN_NUMBER" > ghcr_decision.json
          DECISION_STATUS=$(jq -r '.status' ghcr_decision.json)
          if [ "$DECISION_STATUS" != "ok" ]; then
            {
              echo "## Provenance reconciliation required"
              echo "- registry/tag state or provenance could not be verified; publication/overwrite is refused"
              jq -r '.reconciliation[]' ghcr_decision.json
            } >> "$GITHUB_STEP_SUMMARY"
            die "registry/tag state or provenance could not be verified for SHA(s): $(jq -r '.unknown_shas | join(" ")' ghcr_decision.json); refusing to publish while registry state or provenance is unverified — reconcile and re-run"
          fi
          jq -c '.plan' ghcr_decision.json > plan.json
          if [ "$EVENT_NAME" != "push" ] && [ "$(jq '.absent_shas | length' ghcr_decision.json)" -gt 0 ]; then
            python3 scripts/ghcr_plan.py absent --decision ghcr_decision.json > absent.txt
            run_missing absent.txt
          fi
          echo "shas=$(jq -c '.shas' plan.json)" >> "$GITHUB_OUTPUT"
          {
            echo "## Publish plan"
            echo "- publishing: $(jq -r '.shas | join(" ")' plan.json)"
            echo "- skipped: $(jq -r '[.skipped[] | "\(.sha[:12]) (\(.reason))"] | join(", ")' plan.json)"
            echo "- overflow: $(jq -r '.overflow | join(" ")' plan.json)"
            echo "- re-scheduled (registry tag proven ABSENT by verification; safe to publish): $(jq -r '[.skipped[] | select(.reason == "tag-provenance-unverified") | .sha[:12]] | join(", ")' plan.json)"
            echo "- existing tags verified-published: $(jq '.published_shas | length' ghcr_decision.json)"
            echo "- existing tags proven absent: $(jq -r '.absent_shas | join(" ")' ghcr_decision.json)"
            echo "- existing tags beyond the verify cap (left untouched, provenance unconfirmed): $(jq -r '.over_cap_shas | join(" ")' ghcr_decision.json)"
            jq -r '.notes[] | "- " + .' plan.json
          } >> "$GITHUB_STEP_SUMMARY"
          OVERFLOW=$(jq '.overflow | length' plan.json)
          if [ "$OVERFLOW" -gt 0 ]; then
            echo "::warning::$OVERFLOW sha(s) exceeded the per-run cap MAX=$MAX; oldest-first kept, recover via backfill (schedule or workflow_dispatch backfill=true)"
          fi
      - name: Publish historical validator for pre-M8 publish legs
        # F3: pre-M8 commits have no scripts/ci_checks.sh in their own tree, so
        # the leg needs the CURRENT branch's validator. Artifacts carry only the
        # one trusted file; the leg downloads it into its own workspace.
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: historical-validator
          path: scripts/validate_historical.py
          if-no-files-found: error
          retention-days: 1
      - name: Publish current GHCR verification tools for historical SHA legs
        # Matrix checkouts may predate these scripts; distribute the trusted
        # current versions so every locked leg can re-query registry provenance.
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: ghcr-publish-tools
          path: |
            scripts/ghcr_tags.py
            scripts/ghcr_plan.py
          if-no-files-found: error
          retention-days: 1

  publish:
    # PR events never reach plan/publish (event gate + read-only PR token).
    needs: [test, plan]
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.backfill) }}
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    # Different refs may plan the same SHA as absent. Serialize all publisher
    # legs for that immutable tag and re-check registry state once the lock is held.
    concurrency:
      group: publish-sha-${{ matrix.sha }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        sha: ${{ fromJSON(needs.plan.outputs.shas) }} # [] => job skips with "no entries in matrix" (empty push)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ matrix.sha }}
      - uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          name: historical-validator
          path: historical-validator
      - uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          name: ghcr-publish-tools
          path: ghcr-publish-tools
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
      - name: Install (locked dev group)
        run: uv sync --frozen
      - name: Verify this SHA (checks available for THIS commit, not cached)
        # F3: M8+ commits run the shared check list from their own tree;
        # older commits run the trusted current-branch validator against the
        # historical source (the current commit's checks are NEVER substituted).
        run: |
          set -euo pipefail
          if [ -f scripts/ci_checks.sh ]; then
            echo "- validation: scripts/ci_checks.sh" >> "$GITHUB_STEP_SUMMARY"
            bash scripts/ci_checks.sh
          else
            echo "- validation: historical validator (commit predates scripts/ci_checks.sh)" >> "$GITHUB_STEP_SUMMARY"
            python3 historical-validator/validate_historical.py --repo .
          fi
      - name: Recheck SHA tag after acquiring per-SHA lock
        id: registry_check
        env:
          GHCR_OWNER: ${{ needs.plan.outputs.owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MATRIX_SHA: ${{ matrix.sha }}
        run: |
          set -euo pipefail
          if ! python3 ghcr-publish-tools/ghcr_tags.py verify --owner "${GHCR_OWNER}" \
            --shas "${MATRIX_SHA}" > sha_provenance.json; then
            echo "::error::post-lock immutable SHA provenance query failed; refusing to publish" >&2
            exit 1
          fi
          ACTION=$(python3 ghcr-publish-tools/ghcr_plan.py verify-publish \
            --provenance sha_provenance.json --sha "${MATRIX_SHA}")
          case "$ACTION" in
            skip) echo "- sha-$MATRIX_SHA: already published with matching provenance; skipped" >> "$GITHUB_STEP_SUMMARY" ;;
            publish) echo "- sha-$MATRIX_SHA: tag is absent; safe to publish" >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "::error::invalid per-SHA publication decision '$ACTION'" >&2; exit 1 ;;
          esac
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: ${{ steps.registry_check.outputs.action == 'publish' }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: ${{ steps.registry_check.outputs.action == 'publish' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate image reference before push
        if: ${{ steps.registry_check.outputs.action == 'publish' }}
        # F2: fail loudly BEFORE docker/build-push-action receives any
        # reference. Tag reaches the shell only via env indirection.
        env:
          IMAGE_TAG: ${{ needs.plan.outputs.image }}:sha-${{ matrix.sha }}
        run: |
          set -euo pipefail
          printf '%s' "${IMAGE_TAG}" | LC_ALL=C grep -Eq '^ghcr\.io/[a-z0-9._-]+/shoko-sonarr-linker:sha-[0-9a-f]{40}$' \
            || { echo "::error::invalid image reference '${IMAGE_TAG}'; refusing to invoke docker/build-push-action" >&2; exit 1; }
      - name: Build & push immutable sha-<fullsha> tag
        if: ${{ steps.registry_check.outputs.action == 'publish' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ needs.plan.outputs.image }}:sha-${{ matrix.sha }}
          labels: |
            org.opencontainers.image.title=shoko-sonarr-linker
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ matrix.sha }}
          cache-from: type=gha,scope=sha-${{ matrix.sha }}
          cache-to: type=gha,mode=max,scope=sha-${{ matrix.sha }}
          provenance: true
      - name: Leg report (published / failed)
        if: ${{ !cancelled() }}
        env:
          MATRIX_SHA: ${{ matrix.sha }}
          JOB_STATUS: ${{ job.status }}
        run: 'echo "- sha-$MATRIX_SHA: $JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"'

  promote-latest:
    # latest only for default-branch pushes or main backfills after test/plan
    # success, serialized, head-verified, and backed by exact-SHA provenance.
    needs: [test, plan, publish]
    # fail-fast:false lets every SHA leg run; without job-level continue-on-error,
    # a failed leg fails publish and blocks promotion. A skipped empty matrix is
    # allowed only because the exact RUN_SHA provenance check below remains required.
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.backfill)) && github.ref == 'refs/heads/main' && needs.test.result == 'success' && needs.plan.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    concurrency:
      group: latest-promotion
      cancel-in-progress: false
      # A running promotion is preserved; a newer run may replace an older pending promotion.
      # The head check immediately before the latest push rejects stale candidates before update.
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
      - name: Install (locked dev group)
        run: uv sync --frozen
      - name: Verify head SHA (full checks, not cached)
        run: bash scripts/ci_checks.sh
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate image reference before push
        # F2: same loud gate as the publish legs, for the mutable tag.
        env:
          IMAGE_TAG: ${{ needs.plan.outputs.image }}:latest
        run: |
          set -euo pipefail
          printf '%s' "${IMAGE_TAG}" | LC_ALL=C grep -Eq '^ghcr\.io/[a-z0-9._-]+/shoko-sonarr-linker:latest$' \
            || { echo "::error::invalid image reference '${IMAGE_TAG}'; refusing to invoke docker/build-push-action" >&2; exit 1; }
      - name: Verify immutable SHA image and provenance
        # A successful or skipped matrix result is not image identity proof.
        # Verify the exact candidate tag now; absent/mismatched images block latest.
        env:
          GHCR_OWNER: ${{ needs.plan.outputs.owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! python3 scripts/ghcr_tags.py verify --owner "${GHCR_OWNER}" \
            --shas "${RUN_SHA}" > immutable_provenance.json; then
            echo "::error::immutable SHA provenance query failed; refusing to promote latest" >&2
            exit 1
          fi
          python3 scripts/ghcr_plan.py verify-promotion \
            --provenance immutable_provenance.json --sha "${RUN_SHA}"
      - name: Confirm this run is still the head of main
        env:
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          HEAD=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [ "$HEAD" != "$RUN_SHA" ]; then
            echo "::error::latest NOT promoted: this run's SHA $RUN_SHA is no longer the head of main (now $HEAD); a newer push owns latest — refusing to revert latest to an older build"
            echo "- latest promotion skipped: run SHA superseded by $HEAD" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Build & push latest from the verified head SHA
        # sha- tags are immutable and untouched here; latest is rebuilt from the
        # head SHA's source with identical labels (no mutable tag in publish job).
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ needs.plan.outputs.image }}:latest
          labels: |
            org.opencontainers.image.title=shoko-sonarr-linker
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=latest
          cache-to: type=gha,mode=max,scope=latest
          provenance: true
      - name: Promotion report
        env:
          RUN_SHA: ${{ github.sha }}
        run: echo "- latest -> sha-$RUN_SHA" >> "$GITHUB_STEP_SUMMARY"
