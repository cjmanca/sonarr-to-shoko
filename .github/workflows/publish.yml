# GHCR per-commit publishing (M8, PROJECT.md §6).
#
# Action pins (M8 security review F9) — every `uses:` ref below is pinned to a
# full commit SHA with the tag noted in a trailing comment. SHAs fetched 2026-10-09
# from the GitHub public refs API (git/matching-refs/tags/v<MAJOR>.), newest
# patch release of the major version in use:
#   actions/checkout           v4.4.0    11d5960a326750d5838078e36cf38b85af677262
#   astral-sh/setup-uv         v4.2.0    38f3f104447c67c051c4a08e39b64a148898af3a
#   docker/login-action        v3.7.0    c94ce9fb468520275223c153574b00df6fe4bcc9
#   docker/setup-buildx-action v3.12.0   8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
#   docker/build-push-action   v6.19.2   10e90e3645eae34f1e60eeb005ba3a3d33f178e8
#
# Design decisions
# ----------------
# * Shell-injection hygiene (F1): NO `${{ }}` expression is expanded inside a
#   `run:` script body. Every github.*/inputs.* value reaches the shell only via
#   job/step-level `env:` indirection ("$ENV_VAR"), and dispatch SHA inputs are
#   validated as 40-char lowercase hex before any use, with the range
#   end gated against main (see the plan step). Interpolation remains in
#   `uses:`/`with:`/`if:`/`tags:` — those contexts are evaluated by GitHub, not
#   a shell (build-push `tags:` values become CLI args, never shell text).
# * Immutable SHA tags: every introduced commit (including ones inside a
#   multi-commit push) gets `sha-<fullsha>`. Tag names are derived from the
#   commit SHA, so one name maps to one commit and backfill skips already-
#   tagged SHAs -> published sha- tags are never overwritten in practice.
# * Fork/PR isolation: this workflow's publish/plan/promote jobs are
#   gated to push / schedule / workflow_dispatch events; `pull_request`
#   runs ONLY the read-only test job (GitHub gives PR runs a read-only token,
#   and no job requests `packages: write` on PR events). Nothing is ever
#   published from untrusted PR code.
# * Per-SHA verification is REAL: each matrix leg checks out its own SHA
#   and re-runs the shared check list (scripts/ci_checks.sh) for that
#   commit — no cross-commit cached "pass" is trusted.
# * `latest` is promoted only by promote-latest, serialized via its dedicated
#   concurrency group (`cancel-in-progress: false` so a pending promotion is
#   never cancelled; SHA matrix jobs live under the workflow-level group and
#   are a *different* job, so they are never cancelled by promotion).
#   The promotion step re-reads `git ls-remote` and aborts if this run's SHA is
#   no longer the current head of main -> an old queued run can never
#   revert `latest` to an older build.
# * Least privilege: top-level `contents: read`; only publish/promote-latest
#   add `packages: write`. No repository secrets are referenced at all
#   (`secrets.GITHUB_TOKEN` only) — Sonarr/Shoko keys never exist in CI.
# * Event gap (documented; GitHub does NOT fire `push` workflows for commits
#   created by workflows using GITHUB_TOKEN, e.g. merge-queue/auto-commits).
#   This project never self-commits, so the gap does not arise from our own
#   automation; if a GITHUB_TOKEN-authored commit ever lands
#   on main, the weekly `schedule` backfill and manual
#   `gh workflow run publish.yml -f backfill=true [-f from_sha=... -f to_sha=...]`
#   recover the untagged SHAs. Enumeration/backfill semantics are covered by
#   tests/test_publish_enumeration.py.
# * Dispatch trust boundary (F3): workflow_dispatch requires repository write
#   access — anyone who can dispatch can already run code in this repo. The
#   gate is defense-in-depth, not a secret boundary: `to_sha` must
#   be a 40-hex SHA AND an ancestor of the current main head
#   (`not-ancestor-of-main` fails the plan) so dispatch cannot publish
#   arbitrary out-of-main ranges.
# * Cap: plan enforces max 10 SHAs per run (must match DEFAULT_MAX_SHAS in
#   scripts/enumerate_introduced.py); overflow is reported in the job summary
#   as a warning (failing-soft note) and recovered by backfill — never dropped.
#   A non-positive `max_shas` dispatch input fails closed (plan aborts).

name: Publish (GHCR)

on:
  push:
    branches: ["**"] # branch pushes only; tag pushes are intentionally not triggers
  pull_request:
  workflow_dispatch:
    inputs:
      from_sha:
        description: Range-gap backfill start SHA (exclusive). Empty = whole history up to to_sha.
        required: false
        type: string
      to_sha:
        description: "Backfill range end SHA (default: current default-branch head). Must be a 40-hex SHA and an ancestor of the current main head."
        required: false
        type: string
      backfill:
        description: Recover untagged SHAs (tag-gap scan) instead of doing nothing.
        required: false
        type: boolean
        default: true
      max_shas:
        description: Cap SHAs published in this run (matrix cap; default 10, hard max 10, must be positive).
        required: false
        type: string
        default: "10"
  schedule:
    - cron: "13 3 * * 1" # weekly bounded backfill (Monday ~03:13 UTC)

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  # F2: cancel-in-progress MUST be false here. Cancelling a queued SHA leg
  # silently drops that commit's sha- tag (the leg publishes nothing and
  # nothing re-enumerates it). false keeps one queued run per ref:
  # every queued commit still publishes, just serialized. The cancelled-SHA
  # gap this replaces is eliminated. `latest` promotion keeps its own
  # dedicated serialized group below.
  cancel-in-progress: false

jobs:
  test:
    # Runs for every event (push / pull_request / workflow_dispatch / schedule)
    # against the ACTUAL candidate SHA. For pull_request events GitHub checks out
    # the PR merge ref by default (refs/pull/N/merge) — the merged candidate that
    # the push would produce; documented, deliberate GitHub default.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
      - name: Install (locked dev group)
        run: uv sync --frozen
      - name: Checks (shared list — same commands the per-SHA publish legs run)
        run: bash scripts/ci_checks.sh

  plan:
    needs: test
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.backfill) }}
    runs-on: ubuntu-latest
    # F1: all github.*/inputs.* values reach the shell ONLY through these env
    # indirections; the run body below contains zero `${{ }}` expressions.
    env:
      EVENT_NAME: ${{ github.event_name }}
      PUSH_BEFORE: ${{ github.event.before }}
      PUSH_SHA: ${{ github.sha }}
      PUSH_REF: ${{ github.ref }}
      MAX_SHAS_INPUT: ${{ inputs.max_shas }}
      FROM_SHA_INPUT: ${{ inputs.from_sha }}
      TO_SHA_INPUT: ${{ inputs.to_sha }}
    outputs:
      shas: ${{ steps.plan.outputs.shas }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # full history + merge-base needed for enumeration
      - name: Compute SHA matrix
        id: plan
        run: |
          set -euo pipefail
          ZERO_SHA="0000000000000000000000000000000000000000"
          die() { echo "::error::$1" >&2; exit 1; }
          is_full_sha() {
            [ "${#1}" -eq 40 ] && printf '%s' "$1" | LC_ALL=C grep -Eq '^[0-9a-f]{40}$'
          }
          MAX="${MAX_SHAS_INPUT}"
          if [ -z "$MAX" ]; then MAX=10; fi # matrix cap; MUST match DEFAULT_MAX_SHAS in scripts/enumerate_introduced.py
          case "$MAX" in ''|*[!0-9]*) die "max_shas must be a positive decimal integer (got '$MAX')";; esac
          if [ "$MAX" -le 0 ]; then die "max_shas must be positive (got '$MAX'); refusing to publish under a non-positive cap"; fi
          if [ "$MAX" -gt 10 ]; then MAX=10; fi # hard clamp: dispatch cannot exceed the matrix cap
          FIRST_BUILDABLE=aa6b85ea71192d9c94c7f3c8a58d715c6c37db42 # recorded first-buildable boundary (M1)
          if [ "$EVENT_NAME" = "push" ] && [ "$PUSH_SHA" = "$ZERO_SHA" ]; then
            # F6: branch-deletion push (before=<tip>, after=0000...0) publishes
            # nothing; exit 0 with an empty matrix so the plan is explicit.
            echo "shas=[]" >> "$GITHUB_OUTPUT"
            {
              echo "## Publish plan"
              echo "- branch-deleted: all-zero after SHA (branch deletion); nothing to publish"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git ls-remote --tags origin | awk '{print $2}' > known_tags.txt
          if [ "$EVENT_NAME" = "push" ]; then
            python3 scripts/enumerate_introduced.py introduced \
              --repo . --before "$PUSH_BEFORE" --after "$PUSH_SHA" \
              --ref "$PUSH_REF" --default-branch main \
              --first-buildable "$FIRST_BUILDABLE" --max-shas "$MAX" > plan.json
            # Tag immutability: drop SHAs that already carry a sha- tag (e.g. a recreated
            # branch reports an all-zero `before`, re-enumerating published history).
            jq -c --rawfile tags known_tags.txt \
              '.shas -= ([$tags | split("\n")[] | ltrimstr("refs/tags/") | ltrimstr("sha-") | split("^")[0] | ascii_downcase])' \
              plan.json > plan.filtered.json && mv plan.filtered.json plan.json
          elif [ "$EVENT_NAME" = "schedule" ]; then
            python3 scripts/enumerate_introduced.py missing \
              --repo . --upto "$PUSH_SHA" \
              --known-tags-file known_tags.txt --max-shas "$MAX" > plan.json
          else
            TO="$TO_SHA_INPUT"
            FROM="$FROM_SHA_INPUT"
            if [ -n "$TO" ] && ! is_full_sha "$TO"; then die "invalid to_sha input: not-40-hex (must be a 40-char lowercase hex commit SHA)"; fi
            if [ -n "$FROM" ] && ! is_full_sha "$FROM"; then die "invalid from_sha input: not-40-hex (must be a 40-char lowercase hex commit SHA)"; fi
            if [ -z "$TO" ]; then TO="$PUSH_SHA"; fi
            # F3 dispatch trust boundary (defense-in-depth; dispatch already implies
            # repo write access): the range end must be an ancestor of the current
            # main head, so dispatch cannot publish arbitrary out-of-main ranges.
            MAIN_HEAD=$(git ls-remote origin refs/heads/main | awk '{print $1}')
            if [ -z "$MAIN_HEAD" ]; then die "no refs/heads/main on origin: refusing dispatch publish without a main head to validate against"; fi
            if ! git merge-base --is-ancestor "$TO" "$MAIN_HEAD"; then
              die "invalid to_sha input: not-ancestor-of-main ($TO is not an ancestor of current main head ${MAIN_HEAD}); refusing to publish an out-of-main range"
            fi
            if [ -n "$FROM" ]; then
              python3 scripts/enumerate_introduced.py missing \
                --repo . --upto "$TO" --since "$FROM" \
                --known-tags-file known_tags.txt --max-shas "$MAX" > plan.json
            else
              python3 scripts/enumerate_introduced.py missing \
                --repo . --upto "$TO" \
                --known-tags-file known_tags.txt --max-shas "$MAX" > plan.json
            fi
          fi
          echo "shas=$(jq -c '.shas' plan.json)" >> "$GITHUB_OUTPUT"
          {
            echo "## Publish plan"
            echo "- publishing: $(jq -r '.shas | join(" ")' plan.json)"
            echo "- skipped: $(jq -r '[.skipped[] | "\(.sha[:12]) (\(.reason))"] | join(", ")' plan.json)"
            echo "- overflow: $(jq -r '.overflow | join(" ")' plan.json)"
            jq -r '.notes[] | "- " + .' plan.json
          } >> "$GITHUB_STEP_SUMMARY"
          OVERFLOW=$(jq '.overflow | length' plan.json)
          if [ "$OVERFLOW" -gt 0 ]; then
            echo "::warning::$OVERFLOW sha(s) exceeded the per-run cap MAX=$MAX; oldest-first kept, recover via backfill (schedule or workflow_dispatch backfill=true)"
          fi

  publish:
    # PR events never reach plan/publish (event gate + read-only PR token).
    needs: [test, plan]
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.backfill) }}
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    continue-on-error: true # per-SHA isolation: a failing intermediate SHA skips its own tag and is reported; other SHAs proceed
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        sha: ${{ fromJSON(needs.plan.outputs.shas) }} # [] => job skips with "no entries in matrix" (empty push)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ matrix.sha }}
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
      - name: Install (locked dev group)
        run: uv sync --frozen
      - name: Verify this SHA (full checks, per commit, not cached)
        run: bash scripts/ci_checks.sh
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push immutable sha-<fullsha> tag
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repositoryOwner }}/shoko-sonarr-linker:sha-${{ matrix.sha }}
          labels: |
            org.opencontainers.image.title=shoko-sonarr-linker
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ matrix.sha }}
          cache-from: type=gha,scope=sha-${{ matrix.sha }}
          cache-to: type=gha,mode=max,scope=sha-${{ matrix.sha }}
          provenance: true
      - name: Leg report (published / failed)
        if: ${{ !cancelled() }}
        env:
          MATRIX_SHA: ${{ matrix.sha }}
          JOB_STATUS: ${{ job.status }}
        run: 'echo "- sha-$MATRIX_SHA: $JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"'

  promote-latest:
    # latest ONLY on default-branch pushes, serialized, head-verified.
    needs: [test, plan, publish]
    # F5: deliberately NOT gated on needs.publish.result. The publish matrix runs
    # with continue-on-error: true, so "needs.publish.result == 'success'" is a
    # vacuous gate (it does not mean every SHA verified). This job's real gate is
    # its own full re-check: ci_checks.sh against the checked-out SHA plus the
    # git ls-remote head confirmation below.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.result == 'success' }}
    concurrency:
      group: latest-promotion
      cancel-in-progress: false # never cancel a queued promotion; serialize promotions
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Confirm this run is still the head of main
        env:
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          HEAD=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [ "$HEAD" != "$RUN_SHA" ]; then
            echo "::error::latest NOT promoted: this run's SHA $RUN_SHA is no longer the head of main (now $HEAD); a newer push owns latest — refusing to revert latest to an older build"
            echo "- latest promotion skipped: run SHA superseded by $HEAD" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
      - name: Install (locked dev group)
        run: uv sync --frozen
      - name: Verify head SHA (full checks, not cached)
        run: bash scripts/ci_checks.sh
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push latest from the verified head SHA
        # sha- tags are immutable and untouched here; latest is rebuilt from the
        # head SHA's source with identical labels (no mutable tag in publish job).
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repositoryOwner }}/shoko-sonarr-linker:latest
          labels: |
            org.opencontainers.image.title=shoko-sonarr-linker
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=latest
          cache-to: type=gha,mode=max,scope=latest
          provenance: true
      - name: Promotion report
        env:
          RUN_SHA: ${{ github.sha }}
        run: echo "- latest -> sha-$RUN_SHA" >> "$GITHUB_STEP_SUMMARY"
