# Basic CI: validate every push/PR, build the image, never publish.
# GHCR publishing lives in publish.yml (per-commit SHA tags, least-privilege
# publish job, latest promotion) — this workflow deliberately has
# NO packages:write permission and no registry login.
#
# Action pins (M8 security review F9) — every `uses:` ref below is pinned to a
# full commit SHA with the tag noted in a trailing comment. SHAs fetched 2026-10-09
# from the GitHub public refs API (git/matching-refs/tags/v<MAJOR>.), newest
# patch release of the major version in use:
#   actions/checkout    v4.4.0  11d5960a326750d5838078e36cf38b85af677262
#   actions/setup-python v5.6.0 a26af69be951a213d495a4c3e4e4022e16d87065
#   astral-sh/setup-uv  v4.2.0  38f3f104447c67c051c4a08e39b64a148898af3a

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
      - name: Install (locked dev group)
        run: uv sync --frozen
      # Shared check list (M8): the exact same commands the per-SHA publish
      # legs run (scripts/ci_checks.sh), so CI and publish verification match.
      - name: Checks (shared list)
        run: bash scripts/ci_checks.sh

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build image
        run: docker build -t shoko-sonarr-linker:ci .
      - name: Smoke (CLI help + offline config validate + default-deny gate)
        # Dummy long keys satisfy config load (values stay in the environment;
        # offline validate makes no network call). once --apply must refuse (exit 3)
        # with the safe default config (apply_changes: false).
        run: |
          docker run --rm -e SONARR_API_KEY=ci-dummy-sonarr-key-000000 -e SHOKO_API_KEY=ci-dummy-shoko-key-000000 shoko-sonarr-linker:ci --help
          docker run --rm -e SONARR_API_KEY=ci-dummy-sonarr-key-000000 -e SHOKO_API_KEY=ci-dummy-shoko-key-000000 shoko-sonarr-linker:ci validate --offline config.example.yaml
          rc=0
          docker run --rm -e SONARR_API_KEY=ci-dummy-sonarr-key-000000 -e SHOKO_API_KEY=ci-dummy-shoko-key-000000 shoko-sonarr-linker:ci once --apply config.example.yaml || rc=$?
          test $rc -eq 3
