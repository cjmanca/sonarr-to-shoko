# shoko-sonarr-linker — Compose example for Unraid-style Docker hosts.
#
# All paths below are examples, not deployment facts: adjust to the real
# container-internal media paths, network names, and volumes. The image needs
# ONLY the /data volume; it never mounts media libraries (and Shoko's side
# effects — quality filter, renamer, plugins — are why that stays true).
#
# Connection settings live in the environment only (env-file / host env), never in this file.

services:
  shoko-sonarr-linker:
    # Convenience tag; use an immutable sha-<40-character-commit> tag to pin a release.
    image: ghcr.io/cjmanca/shoko-sonarr-linker:latest
    init: true              # PID-1 signal handling for graceful SIGTERM
    # The ordinary service starts without a YAML config or explicit CLI command.
    # It begins read-only; the automatic linker remains paused until discovery
    # and one-time safety/scope setup are complete.
    restart: unless-stopped
    # F6 shutdown grace: Docker's default 10s stop window is far shorter than one daemon
    # cycle. The interruptible inter-cycle sleep wakes the daemon within a second of SIGTERM
    # when idle, but a SIGTERM that lands *during* a cycle is honoured only after the
    # current cycle/protected unit finishes (no mid-write abort). 360s covers nominal
    # cycles (sync.max_cycle_seconds = 300s gates submissions); a worst-case inline
    # verification-poll sequence can exceed the grace, in which case Docker escalates to
    # SIGKILL — that outcome is recoverable by design (durable submission state; the
    # recovery phase never blindly resubmits).
    stop_grace_period: 360s
    command: ["service"]
    environment:
      SONARR_URL: "${SONARR_URL}"
      SONARR_API_KEY: "${SONARR_API_KEY}"
      SHOKO_URL: "${SHOKO_URL}"
      SHOKO_API_KEY: "${SHOKO_API_KEY}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
    volumes:
      - shoko-sonarr-linker-data:/data
      # For Unraid bind mounts, set PUID=99 and PGID=100 in .env.
      # Startup adjusts ownership of this dedicated state directory and its
      # contents, then runs the application as PUID:PGID.
    # Dashboard listens on container port 8080, but no host port is published by
    # default. To expose it only on the Docker host, opt in explicitly:
    # ports:
    #   - "127.0.0.1:8080:8080"
    # Dashboard authentication is required after first-use account creation.
    # Sonarr and Shoko are existing services; join their Docker network
    # (name is deployment-specific) so configured URLs resolve:
    networks:
      - media

networks:
  media:
    external: true
    name: media            # set this to the existing network shared by Sonarr and Shoko

volumes:
  shoko-sonarr-linker-data:
    # Persistent local volume for SQLite state and the Anime-Lists cache.
    # A bind mount like /mnt/user/appdata/... works too; avoid network shares
    # (SMB/NFS) for the SQLite file — locking is unreliable there.
